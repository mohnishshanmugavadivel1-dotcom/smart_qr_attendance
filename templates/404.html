{% extends "base.html" %}
{% block title %}Page not found — SmartQR{% endblock %}
{% block content %}
<div style="max-width:560px;margin:60px auto;text-align:center">
  <div style="width:80px;height:80px;border-radius:20px;background:#eff6ff;color:var(--primary);display:grid;place-items:center;margin:0 auto;font-size:32px"><i class="fa-solid fa-map-signs"></i></div>
  <h1 style="font-family:Space Grotesk,sans-serif;font-size:32px;margin-top:16px">Page not found</h1>
  <p style="color:var(--muted);margin-top:8px">The page you’re looking for doesn’t exist or you don’t have permission to view it.</p>
  <div style="margin-top:20px;display:flex;gap:10px;justify-content:center">
    <a href="/dashboard/" class="btn btn-primary"><i class="fa-solid fa-house"></i> Go to Dashboard</a>
    <a href="/accounts/login/" class="btn btn-ghost">Login</a>
  </div>
</div>
{% endblock %}
