{% extends "base.html" %}
{% block title %}Something went wrong — SmartQR{% endblock %}
{% block content %}
<div style="max-width:560px;margin:60px auto;text-align:center">
  <div style="width:80px;height:80px;border-radius:20px;background:#fef2f2;color:var(--danger);display:grid;place-items:center;margin:0 auto;font-size:32px"><i class="fa-solid fa-triangle-exclamation"></i></div>
  <h1 style="font-family:Space Grotesk,sans-serif;font-size:32px;margin-top:16px">Something went wrong</h1>
  <p style="color:var(--muted);margin-top:8px">We hit an unexpected error. Please try again. If it persists, contact your teacher or admin.</p>
  <div style="margin-top:20px;display:flex;gap:10px;justify-content:center">
    <a href="/dashboard/" class="btn btn-primary"><i class="fa-solid fa-rotate"></i> Try again</a>
    <a href="/accounts/login/" class="btn btn-ghost">Login</a>
  </div>
</div>
{% endblock %}
